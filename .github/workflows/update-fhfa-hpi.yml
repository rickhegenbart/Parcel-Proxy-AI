name: Update FHFA HPI

on:
  workflow_dispatch:

  schedule:
    # Check for new FHFA quarterly data monthly.
    - cron: "15 13 5 * *"

permissions:
  contents: read

concurrency:
  group: update-fhfa-hpi
  cancel-in-progress: false

jobs:
  update-fhfa:
    name: Validate and update Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify pipeline syntax
        run: python -m py_compile pipeline/update_fhfa_hpi.py

      - name: Update FHFA HPI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.update_fhfa_hpi