name: Update Realtor.com Inventory

on:
  workflow_dispatch:

  schedule:
    # Run monthly on the 8th at 1:30 PM UTC
    - cron: "30 13 8 * *"

permissions:
  contents: read

concurrency:
  group: update-realtor-inventory
  cancel-in-progress: false

jobs:
  update-realtor:
    name: Update Yellowstone County inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify pipeline syntax
        run: python -m py_compile pipeline/update_realtor_inventory.py

      - name: Update Realtor.com inventory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.update_realtor_inventory