name: Update FRED Indicators

on:
  workflow_dispatch:

  schedule:
    # Every Saturday at 12:15 UTC (6:15 AM Mountain Time)
    - cron: "15 12 * * 6"

permissions:
  contents: read

concurrency:
  group: update-fred-indicators
  cancel-in-progress: false

jobs:
  update-fred:
    name: Validate and update Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify pipeline syntax
        run: python -m py_compile pipeline/update_fred_indicators.py

      - name: Update FRED indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.update_fred_indicators
