name: Update School District Mapping

on:
  workflow_dispatch:

  schedule:
    # Run monthly on the third day at 14:30 UTC.
    # This allows the Yellowstone parcel update to finish first.
    - cron: "30 14 3 * *"

permissions:
  contents: read

concurrency:
  group: update-school-district-mapping
  cancel-in-progress: false

jobs:
  update-school-district-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate school district mapping script
        run: |
          python -m py_compile pipeline/update_school_district_mapping.py

      - name: Update parcel school district mappings
        run: |
          python -m pipeline.update_school_district_mapping