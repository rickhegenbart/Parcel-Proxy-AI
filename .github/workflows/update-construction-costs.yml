name: Update Construction Costs

on:
  workflow_dispatch:

  schedule:
    # Monthly on the 18th at 12:40 UTC, after the typical
    # monthly Producer Price Index release window.
    - cron: "40 12 18 * *"

permissions:
  contents: read

concurrency:
  group: update-construction-costs
  cancel-in-progress: false

jobs:
  update-construction-costs:
    name: Update construction-cost indicators
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify pipeline syntax
        run: python -m py_compile pipeline/update_construction_costs.py

      - name: Update construction-cost indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.update_construction_costs