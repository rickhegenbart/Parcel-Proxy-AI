name: Update FEMA National Risk Index

on:
  workflow_dispatch:

  schedule:
    # Check monthly on the 15th at 3:15 PM UTC.
    - cron: "15 15 15 * *"

permissions:
  contents: read

concurrency:
  group: update-fema-nri
  cancel-in-progress: false

jobs:
  update-fema-nri:
    name: Update FEMA environmental context
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify pipeline syntax
        run: python -m py_compile pipeline/update_fema_nri.py

      - name: Update FEMA National Risk Index
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.update_fema_nri