name: Update Census Tract Mapping

on:
  workflow_dispatch:

  schedule:
    # Run monthly after the Yellowstone parcel refresh
    # and before the FEMA NRI context refresh.
    - cron: "0 15 11 * *"

permissions:
  contents: read

concurrency:
  group: update-census-tract-mapping
  cancel-in-progress: false

jobs:
  update-tract-mapping:
    name: Map parcels to Census tracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify pipeline syntax
        run: python -m py_compile pipeline/update_census_tract_mapping.py

      - name: Update Census tract mapping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.update_census_tract_mapping